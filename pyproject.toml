[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-physics-lab"
version = "1.0.0"
description = "Laboratorio di fisica nascosta con operatore umano e agente LLM"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Guido (zalaso)"}]
dependencies = ["matplotlib>=3.8,<4"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
chatgpt = ["openai>=2,<3", "PyJWT[crypto]>=2.10,<3"]
anthropic = ["anthropic>=1,<2"]
gemini = ["google-genai>=2,<3"]
ollama = ["httpx>=0.28,<1"]
all-llm = ["openai>=2,<3", "PyJWT[crypto]>=2.10,<3", "anthropic>=1,<2", "google-genai>=2,<3", "httpx>=0.28,<1"]
llm = ["openai>=2,<3"]
backend = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]
workspace = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "cryptography>=46,<51"]
dev = ["setuptools>=77", "ruff==0.14.10", "build==1.3.0", "PyYAML==6.0.3"]

[project.scripts]
physics-lab = "hidden_lab.cli:main"
zone = "hidden_lab.cli:main"

[tool.setuptools.packages.find]
include = ["hidden_lab*"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["benchmark_data", "sessions", "frontend", "benchmark_private", "benchmark_runs"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"hidden_lab/llm.py" = ["F401"] # Public re-exports preserved from v0.2.

[project.urls]
Homepage = "https://github.com/zalaso/Zone"
Documentation = "https://github.com/zalaso/Zone/tree/master/docs"
Issues = "https://github.com/zalaso/Zone/issues"

[tool.setuptools.package-data]
hidden_lab = ["web/index.html", "web/assets/*.js", "web/assets/*.css", "web/assets/*.svg", "web/assets/*.png", "web/assets/*.woff", "web/assets/*.woff2"]
