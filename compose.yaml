services:
  zone:
    build: .
    image: zone:local
    ports:
      - '127.0.0.1:8766:8765'
    environment:
      ZONE_OPERATOR_TOKEN: ${ZONE_OPERATOR_TOKEN:?Set a random operator token before starting}
      ZONE_ENV: local
    volumes:
      - zone-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: 'no'
volumes:
  zone-data:
