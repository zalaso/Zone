name: Offline quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/benchmark_data/mpl-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-ci.txt -e ".[backend,all-llm,dev]"
      - run: python -m ruff check hidden_lab tests tools
      - run: python -m unittest discover -s tests -q
      - run: python -m hidden_lab ops demo --out benchmark_data/ci-demo
      - run: python -m build --outdir dist
      - run: python tools/check_release.py --archives dist
      - name: Clean wheel installation, restart and live restore
        shell: bash
        run: python tools/verify_distribution.py --mode wheel --wheel dist/*.whl --out benchmark_data/clean-wheel
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:quality
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --tag zone:ci .
      - name: Offline container, persistent restart and live restore
        run: python tools/verify_distribution.py --mode docker --image zone:ci --out benchmark_data/container-verification
