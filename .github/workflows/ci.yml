name: Offline quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/benchmark_data/mpl-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-ci.txt -e ".[workspace,all-llm,dev]"
      - run: python -m ruff check hidden_lab tests tools
      - run: python -m unittest discover -s tests -q
      - run: python -m hidden_lab ops demo --out benchmark_data/ci-demo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: python tools/build_release.py --out dist
      - run: python tools/check_publication.py --history
      - run: python tools/check_docs.py
      - name: Clean wheel installation, restart and live restore
        shell: bash
        run: python tools/verify_distribution.py --mode wheel --wheel dist/*.whl --out benchmark_data/clean-wheel
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:quality
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c ../constraints-ci.txt -e '..[workspace]'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start offline workspace
        run: |
          cd ..
          python -m hidden_lab workspace --data benchmark_data/browser-ci --port 8767 > /tmp/zone-browser.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8767/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm run test:browser:experience
      - name: Respect shared local IP rate window
        run: sleep 60
      - run: pnpm run test:browser:workspace
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: docker build --tag zone:ci .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Offline container, persistent restart and live restore
        run: python tools/verify_distribution.py --mode docker --image zone:ci --out benchmark_data/container-verification
